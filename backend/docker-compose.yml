services:
  backend:
    build: .
    container_name: influenone-backend
    ports:
      - "8023:8023"
    environment:
      - PORT=8023
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - ASI1_API_KEY=${ASI1_API_KEY}
      - ASI1_MODEL=${ASI1_MODEL:-asi1-mini}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_AMOUNT_USD=${STRIPE_AMOUNT_USD:-4.99}
      - FET_WALLET_ADDRESS=${FET_WALLET_ADDRESS}
      - FET_NETWORK=${FET_NETWORK:-testnet}
      - FET_AMOUNT=${FET_AMOUNT:-5}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI}
      - LINKEDIN_SCOPE=${LINKEDIN_SCOPE}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5500}
    env_file:
      - .env
    volumes:
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8023/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
